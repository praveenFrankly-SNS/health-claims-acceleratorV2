bundle:
  name: health-claims-accelerator

targets:
  default:
    mode: development
    default: true
  demo:
    mode: development
    workspace:
      host: https://dbc-8285a47b-ba40.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/health-claims-accelerator

variables:
  catalog:
    description: The Unity Catalog name
    default: health_claims_dev
  schema:
    description: The schema (database) name inside the catalog
    default: claims
  volume:
    description: The volume name for unstructured data
    default: raw_documents
  node_type_id:
    description: The node type to use for the job cluster (cloud agnostic or pool)
    default: Standard_D3_v2
  # Set to "true" to read from Supabase PostgreSQL + Storage.
  # Set to "false" only for local dev with CSVs deployed in the bundle.
  use_supabase:
    description: "Whether to ingest from Supabase (true) or local CSVs (false)"
    default: "true"
  supabase_host:
    description: "Supabase connection pooler host"
    default: "aws-1-ap-northeast-1.pooler.supabase.com"
  supabase_port:
    description: "Supabase PostgreSQL port"
    default: "5432"
  supabase_db:
    description: "Supabase database name"
    default: "postgres"
  supabase_user:
    description: "Supabase PostgreSQL user"
    default: "postgres.nerwqbauracfinfvunul"
  supabase_password:
    description: "Supabase PostgreSQL password — set via CLI or job override, never hardcode"
    default: ""
  supabase_service_key:
    description: "Supabase service role key for Storage API auth — different from DB password"
    default: ""



resources:
  jobs:
    health_claims_setup_training:
      name: "[MVP] Health Claims Setup and Training"
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_supabase
          default: ${var.use_supabase}
        - name: supabase_host
          default: ${var.supabase_host}
        - name: supabase_port
          default: ${var.supabase_port}
        - name: supabase_db
          default: ${var.supabase_db}
        - name: supabase_user
          default: ${var.supabase_user}
        - name: supabase_password
          default: ${var.supabase_password}
        - name: supabase_service_key
          default: ${var.supabase_service_key}
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ./notebooks/00_setup.py
            source: WORKSPACE

        - task_key: bronze
          depends_on: [{ task_key: setup }]
          notebook_task:
            notebook_path: ./notebooks/01_bronze_ingestion.py
            source: WORKSPACE

        - task_key: silver
          depends_on: [{ task_key: bronze }]
          notebook_task:
            notebook_path: ./notebooks/02_silver_preparation_spark_sim.py
            source: WORKSPACE

        - task_key: train_fraud
          depends_on: [{ task_key: silver }]
          notebook_task:
            notebook_path: ./notebooks/04a_train_fraud_model.py
            source: WORKSPACE

        - task_key: train_reserve
          depends_on: [{ task_key: silver }]
          notebook_task:
            notebook_path: ./notebooks/06a_train_reserve_model.py
            source: WORKSPACE

        - task_key: create_vector_index
          depends_on: [{ task_key: silver }]
          notebook_task:
            notebook_path: ./notebooks/04b_create_policy_vector_index.py
            source: WORKSPACE

    health_claims_daily_inference:
      name: "[MVP] Health Claims Daily Inference"
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: "UTC"
        pause_status: "UNPAUSED"
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: use_supabase
          default: ${var.use_supabase}
        - name: supabase_host
          default: ${var.supabase_host}
        - name: supabase_port
          default: ${var.supabase_port}
        - name: supabase_db
          default: ${var.supabase_db}
        - name: supabase_user
          default: ${var.supabase_user}
        - name: supabase_password
          default: ${var.supabase_password}
        - name: supabase_service_key
          default: ${var.supabase_service_key}
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/01_bronze_ingestion.py
            source: WORKSPACE

        - task_key: silver
          depends_on: [{ task_key: bronze }]
          notebook_task:
            notebook_path: ./notebooks/02_silver_preparation_spark_sim.py
            source: WORKSPACE

        - task_key: orchestrate
          depends_on: [{ task_key: silver }]
          notebook_task:
            notebook_path: ./notebooks/07_supervisor_orchestrator.py
            source: WORKSPACE

        - task_key: gold_serving
          depends_on: [{ task_key: orchestrate }]
          notebook_task:
            notebook_path: ./notebooks/09_gold_serving.py
            source: WORKSPACE

        - task_key: evaluation
          depends_on: [{ task_key: gold_serving }]
          notebook_task:
             notebook_path: ./notebooks/10_evaluation.py
             source: WORKSPACE

  apps:
    health_claims_dashboard:
      name: "health-claims-dashboard"
      source_code_path: ./app
